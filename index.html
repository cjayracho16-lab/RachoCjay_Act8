<!DOCTYPE html>
<html>
<head>
  <title>Halloween Ask Me Anything</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #160d27;
      background-image:
        linear-gradient(
          rgba(22, 13, 39, 0.35),
          rgba(22, 13, 39, 0.55)
        ),
        url("https://i.ibb.co/8nwTxXC8/received-27830369673220280.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 30px auto;
      padding: 25px;
      background: rgba(41, 22, 63, 0.82);
      border: 3px solid #ff8c00;
      border-radius: 20px;
      box-shadow: 0 0 18px #ff6600;
    }

    h1 {
      color: #ff9d00;
      font-size: 30px;
    }

    p {
      color: #eadcf8;
    }

    .pumpkin {
      font-size: 55px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      margin-top: 12px;
      border: 2px solid #ff8c00;
      border-radius: 12px;
      background: #160d27;
      color: white;
      font-size: 16px;
      resize: vertical;
    }

    textarea::placeholder {
      color: #cbb9dc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #ff8c00;
      color: #1b1028;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffc04d;
    }

    .question {
      background: #59327c;
      color: white;
      border: 1px solid #a879d1;
    }

    .clear {
      background: #453052;
      color: white;
      border: 1px solid #a879d1;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #cbb9dc;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="pumpkin">🎃</div>

    <h1>Pangutanag Tarung Ha! para di tika ma hinaykan ba</h1>

    <p>👻 Welcome to my spoongky Domain Web!</p>
    <p>Send me a question, secret, or fun message.</p>

    <h3>🕸️ Choose a question</h3>

    <button class="question" type="button"
      onclick="chooseQuestion('What was your first impression of me?')">
      💜 First impression of me?
    </button>

    <button class="question" type="button"
      onclick="chooseQuestion('Tell me something funny!')">
      😂 Tell me something funny
    </button>

    <button class="question" type="button"
      onclick="chooseQuestion('Ask me a random question!')">
      👀 Ask me anything
    </button>

    <form action="https://formspree.io/f/mgaaojyr"
      method="POST">

      <textarea id="message"
        name="message"
        placeholder="Type your message here... 👻"
        maxlength="500"
        required></textarea>

      <button type="submit">
        🎃 Send Anonymously
      </button>

      <button class="clear" type="button"
        onclick="clearMessage()">
        🧹 Clear Message
      </button>
    </form>

    <p class="footer">
      🦇 Made with Cjay nga sgiig spoongky nga Halloween kyg nawng! 🦇
    </p>

  </div>

  <script>
    function chooseQuestion(question) {
      document.getElementById("message").value = question;
    }

    function clearMessage() {
      document.getElementById("message").value = "";
    }
  </script>
</body>
</html>
